openapi: 3.0.3
info:
  title: Rail Fixture API
  version: 0.1.0
paths:
  /orders:
    get:
      summary: List orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        status:
          type: string
        # non-breaking: 任意フィールド追加
        note:
          type: string
