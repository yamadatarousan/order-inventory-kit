openapi: 3.0.3
# 境界の単一参照点（契約の一次情報）
# ここ以外に境界仕様を書かない前提で、生成/差分/テストの基準にする
info:
  title: Order Inventory API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /orders:
    post:
      summary: Create order (reserve inventory)
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Order accepted
          # 200の意味を固定する（accepted）
          # 200が返る＝注文が受理され、以降の参照で確認可能である前提
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderId}:
    get:
      summary: Get order by id
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          # 存在しないIDは404とする前提
          # 200 + 空レスポンスではなく、明示的にNot Foundを返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderId}/cancel:
    post:
      summary: Cancel order (release inventory)
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payments/confirm:
    post:
      summary: Confirm payment (idempotent)
      operationId: confirmPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: Payment confirmed
          # 冪等性の固定は境界テストで担保する
          # 同一 idempotencyKey での二重課金が起きないことが条件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmPaymentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
    CreateOrderResponse:
      type: object
      required:
        - orderId
        - status
      properties:
        orderId:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
    ConfirmPaymentRequest:
      type: object
      required:
        - orderId
        - amount
        - idempotencyKey
      properties:
        orderId:
          type: string
        amount:
          type: integer
        idempotencyKey:
          type: string
    ConfirmPaymentResponse:
      type: object
      required:
        - orderId
        - paymentStatus
      properties:
        orderId:
          type: string
        paymentStatus:
          type: string
          enum:
            - confirmed
    Order:
      type: object
      required:
        - id
        - status
        - items
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
    OrderStatus:
      type: string
      enum:
        - accepted
        - confirmed
        - canceled
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
